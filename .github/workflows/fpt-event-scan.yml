name: FPT Event Scanner

on:
  schedule:
    - cron: "0-59/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "cloudflare/fpt-event-worker/tools/source-live-scanner.py"
      - "sources/fpt-events-source.m3u"
      - ".github/workflows/fpt-event-scan.yml"

permissions:
  contents: write

# Scanner trigger probe: 2026-10-02
concurrency:
  group: nm7-fpt-event-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate scanner
        run: python3 -m py_compile cloudflare/fpt-event-worker/tools/source-live-scanner.py

      - name: Scan FPT source
        env:
          OUTPUT_M3U: generated/fpt-event-live.m3u
          OUTPUT_STATUS: generated/fpt-event-live.status.json
          MAX_PROXY_TRIES: "24"
          MAX_WORKERS: "6"
          PROBE_TIMEOUT: "10"
        run: python3 cloudflare/fpt-event-worker/tools/source-live-scanner.py

      - name: Validate scan
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(Path("generated/fpt-event-live.status.json").read_text(encoding="utf-8"))
          candidates = int(status["candidates"])
          live = int(status["liveEntries"])
          inactive = int(status["inactiveEntries"])
          errors = int(status["probeErrors"])

          # Derive the expected candidate count from the current M3U source.
          # The source list may legitimately grow; do not hard-code an old count.
          source_lines = Path("sources/fpt-events-source.m3u").read_text(encoding="utf-8").splitlines()
          source_urls = []
          for index, line in enumerate(source_lines):
              if not line.strip().startswith("#EXTINF"):
                  continue
              for candidate_line in source_lines[index + 1:min(index + 8, len(source_lines))]:
                  candidate = candidate_line.strip()
                  if not candidate or candidate.startswith("#"):
                      continue
                  if candidate.startswith(("http://", "https://")):
                      source_urls.append(candidate)
                      break

          expected_candidates = len(set(source_urls))
          assert expected_candidates > 0, "Source M3U contains no valid unique HTTP(S) URLs"
          assert candidates == expected_candidates, (
              f"Expected {expected_candidates} unique source URLs parsed from "
              f"sources/fpt-events-source.m3u, got {candidates}"
          )
          assert live + inactive + errors == candidates, "Scan totals do not add up"
          assert live > 0 or errors == 0, (
              f"Scan produced no verified live stream and has {errors} probe errors"
          )
          assert (
              status.get("scanHealthy") is True
              or (status.get("partialScan") is True and live > 0)
          ), "Scan is neither healthy nor a valid partial live scan"

          print(
              f"FPT scan accepted: {candidates} candidates, {live} verified live, "
              f"{inactive} inactive, {errors} unresolved probes"
          )
          PY

      - name: Validate output URLs
        run: |
          set -euo pipefail
          SOURCE="sources/fpt-events-source.m3u"
          PLAYLIST="generated/fpt-event-live.m3u"

          grep -q '^#EXTM3U' "$PLAYLIST"

          while IFS= read -r url; do
            test -z "$url" && continue
            grep -Fqx "$url" "$SOURCE" || {
              echo "Output URL is not present in source: $url"
              exit 1
            }
          done < <(grep -E '^https?://' "$PLAYLIST")

          if grep -Eq 'livecdn\.fptplay\.net/schedule|vhd0/Stuff|vuminhthanh12|metadata-assisted' "$PLAYLIST"; then
            echo "Forbidden legacy/non-source URL detected"
            exit 1
          fi

      - name: Validate playlist matches scanner result
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(Path("generated/fpt-event-live.status.json").read_text(encoding="utf-8"))
          playlist = Path("generated/fpt-event-live.m3u").read_text(encoding="utf-8")

          expected = [row["url"] for row in status.get("liveChannels", [])]
          actual = [line.strip() for line in playlist.splitlines() if line.strip().startswith(("http://", "https://"))]

          assert len(actual) == len(set(actual)), "Generated playlist contains duplicate URLs"
          assert actual == expected, "Generated playlist URLs do not exactly match scanner liveChannels"
          assert status.get("sourceOnly") is True, "Scanner status is not source-only"

          source_lines = {
              line.strip()
              for line in Path("sources/fpt-events-source.m3u").read_text(encoding="utf-8").splitlines()
              if line.strip().startswith(("http://", "https://"))
          }
          assert set(actual).issubset(source_lines), "Generated playlist contains a URL outside source M3U"

          print(f"Playlist/scanner exact-match verified: {len(actual)} live URLs")
          PY

      - name: Publish changed result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep this scan result isolated from concurrent main-branch changes.
          # On each retry, compare generatedAt and publish only if this scan is
          # newer than the currently published FPT result.
          WORK="$(mktemp -d)"
          cp generated/fpt-event-live.m3u "$WORK/fpt-event-live.m3u"
          cp generated/fpt-event-live.status.json "$WORK/fpt-event-live.status.json"

          LOCAL_TS="$(python3 - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path("generated/fpt-event-live.status.json").read_text())["generatedAt"])
          PY
          )"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            REMOTE_TS="$(git show origin/main:generated/fpt-event-live.status.json 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin).get("generatedAt",""))' || true)"

            if ! python3 - "$LOCAL_TS" "$REMOTE_TS" <<'PY'
          import sys
          from datetime import datetime
          local, remote = sys.argv[1], sys.argv[2]
          if remote and local and datetime.fromisoformat(remote) > datetime.fromisoformat(local):
              raise SystemExit(1)
          PY
            then
              echo "Remote FPT result is newer; this scan will not overwrite it."
              exit 0
            fi

            git reset --hard origin/main
            cp "$WORK/fpt-event-live.m3u" generated/fpt-event-live.m3u
            cp "$WORK/fpt-event-live.status.json" generated/fpt-event-live.status.json

            if git diff --quiet -- generated/fpt-event-live.m3u generated/fpt-event-live.status.json; then
              echo "FPT playlist and status unchanged after rebase."
              exit 0
            fi

            git add generated/fpt-event-live.m3u generated/fpt-event-live.status.json
            git commit -m "data(fpt): update current live event set"

            if git push origin HEAD:main; then
              echo "Published FPT result successfully."
              exit 0
            fi

            echo "Push race detected (attempt $attempt/5); retrying..."
            git reset --hard origin/main
            sleep $((attempt * 2))
          done

          echo "Could not publish FPT result after 5 attempts."
          exit 1

