name: Update sports auto playlist (multi-source)
# Triggered from ChatGPT to verify GitHub Actions auto-refresh path: 2026-09-24T08:19:20.960Z
# Force a run after the group-scoped dedupe fix.

on:
  schedule:
    - cron: '0-59/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-sports-auto.yml'
      - 'sources/**'

permissions:
  contents: write

concurrency:
  group: update-sports-auto
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fetch sources A/B
        shell: bash
        run: |
          set +e
          fetch() {
            name="$1"; url="$2"
            rm -f "/tmp/$name.m3u"
            curl -L --fail --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 60 -A 'Mozilla/5.0 NM7-IPTV-Sports/2.0' -H 'Cache-Control: no-cache' "$url" -o "/tmp/$name.m3u"
            rc=$?
            if [ "$rc" -eq 0 ] && grep -qi '#EXTINF' "/tmp/$name.m3u"; then
              echo "SOURCE_$name=1" >> "$GITHUB_ENV"; echo "SOURCE_$name=OK"
            else
              echo "SOURCE_$name=0" >> "$GITHUB_ENV"; rm -f "/tmp/$name.m3u"; echo "SOURCE_$name=FAIL"
            fi
          }
          fetch A 'https://thtt.pages.dev/tttt.m3u'
          fetch B 'https://thcoban.github.io/thtt/tttt.m3u'

      - name: Build and validate sports playlist
        env:
          TZ: Asia/Ho_Chi_Minh
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures, datetime as dt, os, re, subprocess, unicodedata
          from pathlib import Path
          from urllib.parse import urlparse
          from zoneinfo import ZoneInfo

          VN=ZoneInfo("Asia/Ho_Chi_Minh")
          NOW=dt.datetime.now(VN)
          MAX_AGE=180
          TIMEOUT=7
          WORKERS=24
          GROUPS={"Vua Sân Cỏ TV","Khán Đài TV","Cola TV","Gà Vàng TV","Gà Vàng 24h TV","Xôi Lạc Z TV","Gà Vàng 33 TV","S8 TV","Sao Kê TV","Bia Ôm TV","Chuối Chiên TV","Giờ Vàng TV","Socolive TV","Pháo Hoa TV","Nấu Xôi TV","SP TV (China)","Sút Bóng TV","Phá Làng TV"}

          def norm_group(s):
              s=unicodedata.normalize("NFKD",s)
              s="".join(c for c in s if not unicodedata.combining(c))
              s=s.lower().replace("&"," and ")
              s=re.sub(r"[^a-z0-9]+"," ",s)
              return re.sub(r"\s+"," ",s).strip()

          GROUP_MAP={norm_group(g):g for g in GROUPS}

          def blocks(t):
              return [b for b in re.split(r"(?=#EXTINF\s*:)",t.replace("\r","")) if re.match(r"\s*#EXTINF\s*:",b,re.I)]

          bp=Path("/tmp/B.m3u")
          if bp.exists():
              for b in blocks(bp.read_text(encoding="utf-8",errors="ignore")):
                  m=re.search(r'group-title="([^"]+)"',b,re.I)
                  if m and m.group(1).strip():
                      GROUPS.add(m.group(1).strip())
              GROUP_MAP={norm_group(g):g for g in GROUPS}

          def parse(b):
              lines=[x.strip() for x in b.splitlines() if x.strip()]
              ext=lines[0] if lines else ""
              name=ext.rsplit(",",1)[-1].strip() if "," in ext else ext
              url=next((x for x in lines[1:] if re.match(r"^https?://",x,re.I)),None)
              gm=re.search(r'group-title="([^"]+)"',ext,re.I)
              raw=gm.group(1).strip() if gm else ""
              return name,GROUP_MAP.get(norm_group(raw),raw),url,lines

          def norm(s):
              s=unicodedata.normalize("NFKD",s)
              s="".join(c for c in s if not unicodedata.combining(c))
              s=s.lower()
              s=re.sub(r"\[hls\]|\b18\+\b"," ",s,flags=re.I)
              s=re.sub(r"\s*\([^)]*\)\s*$"," ",s)
              s=re.sub(r"[^a-z0-9]+"," ",s)
              return re.sub(r"\s+"," ",s).strip()

          def key(name, group=""):
              s=re.sub(r"^\s*[🟢🟡🔴⚽🏐🏀🎾]+\s*","",name)
              s=re.sub(r"^\s*\d{1,2}:\d{2}\s+\d{1,2}/\d{1,2}\s*","",s)
              s=re.sub(r"^\s*\d{1,2}:\d{2}\s*","",s)
              s=re.sub(r"\s*\([^)]*\)\s*$","",s)
              s=re.sub(r"\s*\[[^]]+\]\s*$","",s)
              s=re.sub(r"\b18\+\b","",s,flags=re.I)
              m=re.split(r"\s+v(?:s)?\s+",s,maxsplit=1,flags=re.I)
              match=norm(m[0])+" vs "+norm(m[1]) if len(m)==2 else norm(s)
              return norm(group)+" :: "+match

          def event_dt(name):
              m=re.search(r"(\d{1,2}):(\d{2})\s+(\d{1,2})/(\d{1,2})",name)
              if m:
                  h,mi,d,mo=map(int,m.groups())
                  candidates=[]
                  for y in (NOW.year-1,NOW.year,NOW.year+1):
                      try: candidates.append(dt.datetime(y,mo,d,h,mi,tzinfo=VN))
                      except ValueError: pass
                  return min(candidates,key=lambda x:abs((x-NOW).total_seconds())) if candidates else None
              m=re.search(r"(\d{1,2}):(\d{2})",name)
              if m:
                  h,mi=map(int,m.groups())
                  x=NOW.replace(hour=h,minute=mi,second=0,microsecond=0)
                  if x-NOW<dt.timedelta(hours=-12): x+=dt.timedelta(days=1)
                  return x
              return None

          def usable(b):
              name,group,url,lines=parse(b)
              if not group or not url or url.lower()=="none": return None
              when=event_dt(name)
              if when and (NOW-when).total_seconds()/60>MAX_AGE: return None
              kept=[lines[0]]
              for line in lines[1:]:
                  if line.startswith("#EXTVLCOPT:"): kept.append(line)
                  elif re.match(r"^https?://",line,re.I):
                      kept.append(line)
                      break
              return {"name":name,"group":group,"url":url,"block":"\n".join(kept),"key":key(name,group),"when":when}

          candidates={}
          stats={}
          def add(path,label):
              p=Path(path)
              raw=dated=kept=expired=undated=invalid=0
              if p.exists():
                  for b in blocks(p.read_text(encoding="utf-8",errors="ignore")):
                      raw += 1
                      name,group,url,lines=parse(b)
                      if not group or not url or url.lower()=="none":
                          invalid += 1; continue
                      when=event_dt(name)
                      if when is None: undated += 1
                      else:
                          dated += 1
                          if (NOW-when).total_seconds()/60>MAX_AGE:
                              expired += 1; continue
                      x=usable(b)
                      if x:
                          kept += 1
                          candidates.setdefault(x["key"],[]).append({**x,"source":label})
              stats[label]={"raw":raw,"dated":dated,"kept":kept,"expired":expired,"undated":undated,"invalid":invalid}

          if os.getenv("SOURCE_A")=="1": add("/tmp/A.m3u","A")
          if os.getenv("SOURCE_B")=="1": add("/tmp/B.m3u","B")
          add("sources/golden-tv-selected.m3u","C")
          add("sources/sport-selected.m3u","D")

          # Do not probe every stream here. The probe results were diagnostic-only
          # and could make a 5-minute scheduled run overlap/queue. The playlist
          # is built from source data and validated by the 180-minute rule.
          priority={"A":0,"B":1,"C":2,"D":3}
          # Health checks are diagnostic only. They must NEVER remove a
          # source/group from the playlist: a stream can be temporarily
          # unreachable while still being a valid playlist entry.
          selected=[]
          for k,xs in candidates.items():
              best=min(priority.get(x["source"],99) for x in xs)
              selected += [x for x in xs if priority.get(x["source"],99)==best]

          GROUP_ORDER=["Vua Sân Cỏ TV","Khán Đài TV","Cola TV","Gà Vàng TV","Gà Vàng 24h TV","Xôi Lạc Z TV","Gà Vàng 33 TV","S8 TV","Sao Kê TV","Bia Ôm TV","Chuối Chiên TV","Giờ Vàng TV","Socolive TV","Pháo Hoa TV","Nấu Xôi TV","SP TV (China)","Sút Bóng TV","Phá Làng TV"]
          GROUP_ORDER_MAP={norm_group(g):i for i,g in enumerate(GROUP_ORDER)}
          selected.sort(key=lambda x:(GROUP_ORDER_MAP.get(norm_group(x["group"]),9999),x["when"] is None,x["when"] or dt.datetime.max.replace(tzinfo=VN),x["name"],x["url"]))
          # No previous-playlist fallback. Only entries rebuilt from the current sources are emitted.
          # Undated/static channels from the current sources are already in `selected` and sort last.
          static_blocks=[]
          merged=[]
          seen=set()
          for x in selected:
              if x["block"] not in seen:
                  seen.add(x["block"]); merged.append(x["block"])
          for block in static_blocks:
              if block not in seen:
                  seen.add(block); merged.append(block)

          print("=== SOURCE STATUS ===")
          for label in ("A","B","C","D"):
              s=stats.get(label,{})
              status=("OK" if (os.getenv(f"SOURCE_{label}")== "1" if label in ("A","B") else s.get("raw",0)>0) else "FAIL")
              print(f"SOURCE_{label}={status} RAW={s.get('raw',0)} DATED={s.get('dated',0)} KEPT={s.get('kept',0)} EXPIRED_GT_{MAX_AGE}M={s.get('expired',0)} UNDATED={s.get('undated',0)} INVALID={s.get('invalid',0)}")
          candidate_count=sum(len(xs) for xs in candidates.values())
          print(f"CANDIDATES={candidate_count} MATCHES={len(candidates)} SELECTED={len(selected)} STATIC_PRESERVED={len(static_blocks)} OUTPUT_BLOCKS={len(merged)} NOW_VN={NOW.isoformat()}")
          print(f"FILTER_RULE=remove_only_dated_matches_older_than_{MAX_AGE}_minutes; DEDUPE_SCOPE=GROUP+MATCH")

          if not merged:
              raise SystemExit("Refusing to write empty sports-auto.m3u")

          output_text="#EXTM3U\n"+"\n".join(merged)+"\n"
          Path("sports-auto.m3u").write_text(output_text,encoding="utf-8")

          # Hard validation: no dated match older than MAX_AGE may remain.
          output=blocks(output_text)
          stale=[]
          for b in output:
              name,_,_,_=parse(b)
              when=event_dt(name)
              if when is not None and (NOW-when).total_seconds()/60>MAX_AGE:
                  stale.append((name,when.isoformat()))
          if stale:
              print("STALE_OUTPUT_SAMPLE="+repr(stale[:10]))
              raise SystemExit("Validation failed: stale match remained in sports-auto.m3u")
          print("PLAYLIST_UPDATED=1")

          PY

      - name: Commit updated playlist
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sports-auto.m3u
          if git diff --cached --quiet; then echo "Playlist unchanged."; exit 0; fi
          git commit -m 'auto: update resilient sports playlist'

          # Other repository workflows can write to main at the same time.
          # Rebase and retry so a harmless race does not fail this refresh.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Could not rebase sports playlist commit onto latest main."
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race detected (attempt $attempt/5); retrying..."
            sleep $((attempt * 2))
          done

          echo "::error::Failed to push sports playlist after 5 attempts."
          exit 1
