name: Publish TV365 M3U to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - tv365.m3u
      - .github/workflows/deploy-tv365-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tv365-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify playlist
        run: |
          test -s tv365.m3u
          head -n 1 tv365.m3u | grep -q '^#EXTM3U'

      - name: Prepare site
        run: |
          mkdir -p _site
          cp tv365.m3u _site/tv365.m3u
          printf '%s\n' 'TV365 M3U playlist endpoint' > _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
