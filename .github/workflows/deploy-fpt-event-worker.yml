name: Deploy NM7 FPT Event Worker
# cnktvpc ownership cutover: verify migrated raw source URLs on deployment

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/fpt-event-worker/src/**"
      - "cloudflare/fpt-event-worker/wrangler.jsonc"
      - ".github/workflows/deploy-fpt-event-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-nm7-fpt-event-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Validate Worker JavaScript
        shell: bash
        working-directory: cloudflare/fpt-event-worker
        run: |
          set -euo pipefail
          node --check src/index.js

      - name: Check Cloudflare deployment credentials
        id: cf-credentials
        shell: bash
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -n "$CF_ACCOUNT_ID" && -n "$CF_API_TOKEN" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare deployment secrets are not configured in this repository. Worker runtime validation still runs, but deployment steps are skipped. Add CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN to enable automatic Worker deployment."
          fi
      - name: Reconcile Cloudflare Cron schedules
        if: steps.cf-credentials.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/workers/scripts/nm7-fpt-event-live/schedules"
          AUTH="Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}"
          BEFORE="$(curl -fsSL --retry 3 --retry-delay 2 --max-time 30 -H "$AUTH" "$BASE")"
          echo "Schedules before reconcile:"
          echo "$BEFORE"
          curl -fsSL --retry 3 --retry-delay 2 --max-time 30 -X PUT -H "$AUTH" -H "Content-Type: application/json" "$BASE" --data "[]"
          AFTER="$(curl -fsSL --retry 3 --retry-delay 2 --max-time 30 -H "$AUTH" "$BASE")"
          echo "Schedules after reconcile:"
          echo "$AFTER"
          echo "$AFTER" | jq -e '.success == true and (.result.schedules | length) == 0' >/dev/null
      - name: Deploy Worker
        if: steps.cf-credentials.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/fpt-event-worker
          wranglerVersion: "4"
          command: |
            deploy src/index.js --config wrangler.jsonc
            triggers deploy --config wrangler.jsonc

      - name: Verify Cloudflare Cron schedules after deploy
        if: steps.cf-credentials.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/workers/scripts/nm7-fpt-event-live/schedules"
          AUTH="Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}"
          AFTER="$(curl -fsSL --retry 3 --retry-delay 2 --max-time 30 -H "$AUTH" "$BASE")"
          echo "Schedules after Worker deploy:"
          echo "$AFTER"
          echo "$AFTER" | jq -e '.success == true and (.result.schedules | length) == 0' >/dev/null
      - name: Verify delivery Worker
        if: steps.cf-credentials.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://nm7-fpt-event-live.phuongnm7-iptv.workers.dev"
          BODY="$(curl -fsSL --retry 3 --retry-delay 2 --max-time 30 "$BASE/scan")"
          echo "$BODY"
          echo "$BODY" | jq -e '
            .workerVersion == "fpt-event-delivery-v17"
            and .scannerOwner == "GitHub Actions"
            and .deliveryOwner == "Cloudflare Worker"
            and .schedule == "*/5 * * * *"
          ' >/dev/null

          PLAYLIST_HEADERS="$(curl -fsS -D - -o /dev/null --retry 3 --retry-delay 2 --max-time 30 "$BASE/fpt-event-live.m3u")"
          echo "$PLAYLIST_HEADERS"
          echo "$PLAYLIST_HEADERS" | grep -qi '^content-type: application/x-mpegURL'
          echo "$PLAYLIST_HEADERS" | grep -qi '^x-nm7-fpt-version: fpt-event-delivery-v17'
          echo "Verified: Worker is delivery-only; GitHub Actions owns the 5-minute FPT scan."
