name: Update merged IPTV playlist

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0-0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: github.event_name != 'schedule' || github.event.schedule == '0-0 * * * *'
    runs-on: ubuntu-latest
    concurrency:
      group: update-merged-iptv
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Sync with latest main before merge
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Fetch, filter, and merge playlists
        env:
          UPSTREAM_URL: https://raw.githubusercontent.com/vuminhthanh12/vuminhthanh12/main/vmttv
          VTVCAP_URL: https://tv.vietanhtv.top/sex/
          GOLDEN_TV_URL: https://tinyurl.com/ttthethao2
          UK_FOOTBALL_URL: https://uk-football-playlist.phuongnm7-iptv.workers.dev/537f0ceb5b4342b1963715b15121a883/playlist.m3u
          EXTRA_PLAYLIST: sources/vAppTV_non_DRM.m3u
          SPORT_PLAYLIST: sources/sport-selected.m3u
          VTVCAP_FALLBACK: sources/vtvcab-on-sports.m3u
          GOLDEN_TV_FALLBACK: sources/golden-tv-selected.m3u
          UK_FOOTBALL_FALLBACK: sources/uk-football-selected.m3u
          EXCLUDED_GROUPS: sources/excluded-groups.txt
          OUTPUT_PLAYLIST: IPTV_Gop_VMTTV_vAppTV.m3u
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "$UPSTREAM_URL" --output upstream.m3u
          if ! curl --fail --location --retry 3 --retry-delay 2 "$VTVCAP_URL" --output vtvcab-source.m3u; then
            cp "$VTVCAP_FALLBACK" vtvcab-source.m3u
          fi
          if curl --fail --location --retry 3 --retry-delay 2 "$GOLDEN_TV_URL" --output golden-tv-source.m3u; then
            export GOLDEN_TV_SOURCE_READY=1
          else
            export GOLDEN_TV_SOURCE_READY=0
          fi
          if curl --fail --location --retry 3 --retry-delay 2 "$UK_FOOTBALL_URL" --output uk-football-source.m3u; then
            export UK_FOOTBALL_SOURCE_READY=1
          else
            export UK_FOOTBALL_SOURCE_READY=0
          fi
          python3 - <<'PY'
          import os
          import re
          import unicodedata
          from pathlib import Path

          TARGET_CHANNELS = ["ON SPORTS", "ON SPORTS+", "ON FOOTBALL", "ON SPORTS NEWS"]
          GOLDEN_TV_GROUPS = ("ga vang tv", "ga vang 33 tv", "gio vang tv", "phao hoa tv")
          UK_FOOTBALL_GROUPS = {
              "uk | sports",
          }

          def normalize(value):
              decomposed = unicodedata.normalize("NFD", value)
              return "".join(char for char in decomposed if unicodedata.category(char) != "Mn").casefold().replace("đ", "d").strip()

          def extract_vtvcab_entries(lines):
              entries = {}
              current = []

              def consider():
                  if not current:
                      return
                  extinf = current[0]
                  group_match = re.search(r'''group-title=(?:"([^"]*)"|'([^']*)')''', extinf, flags=re.I)
                  group = normalize((group_match.group(1) or group_match.group(2)) if group_match else "")
                  name = extinf.rsplit(",", 1)[-1].strip().upper()
                  if "vtvcab" in group and name in TARGET_CHANNELS:
                      entries[name] = "\n".join(current).strip()

              for line in lines:
                  if line.startswith("#EXTINF:"):
                      consider()
                      current = [line]
                  elif current:
                      current.append(line)
              consider()
              return entries

          def extract_golden_tv_entries(lines):
              entries = []
              current = []

              def consider():
                  if not current:
                      return
                  extinf = current[0]
                  group_match = re.search(r'''group-title=(?:"([^"]*)"|'([^']*)')''', extinf, flags=re.I)
                  group = normalize((group_match.group(1) or group_match.group(2)) if group_match else "")
                  if any(name in group for name in GOLDEN_TV_GROUPS):
                      entry = "\n".join(line for line in current if not line.lstrip().startswith("<")).strip()
                      if entry:
                          entries.append(entry)

              for line in lines:
                  if line.startswith("#EXTINF:"):
                      consider()
                      current = [line]
                  elif current:
                      current.append(line)
              consider()
              return entries

          def extract_uk_football_entries(lines):
              entries = []
              current = []

              def consider():
                  if not current:
                      return
                  extinf = current[0]
                  group_match = re.search(r'''group-title=(?:"([^"]*)"|'([^']*)')''', extinf, flags=re.I)
                  group = normalize((group_match.group(1) or group_match.group(2)) if group_match else "")
                  if group in UK_FOOTBALL_GROUPS:
                      entry = "\n".join(current).strip()
                      if entry:
                          entries.append(entry)

              for line in lines:
                  if line.startswith("#EXTINF:"):
                      consider()
                      current = [line]
                  elif current:
                      current.append(line)
              consider()
              return entries

          excluded = {
              normalize(line)
              for line in Path(os.environ["EXCLUDED_GROUPS"]).read_text(encoding="utf-8-sig").splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          }
          upstream_lines = Path("upstream.m3u").read_text(encoding="utf-8-sig").splitlines()
          filtered_lines = []
          skipping_entry = False

          for line in upstream_lines:
              if line.startswith("#EXTINF:"):
                  match = re.search(r'''group-title=(?:"([^"]*)"|'([^']*)')''', line, flags=re.I)
                  group = normalize((match.group(1) or match.group(2)) if match else "")
                  skipping_entry = any(keyword in group for keyword in excluded)
              if not skipping_entry:
                  filtered_lines.append(line)

          extra_lines = Path(os.environ["EXTRA_PLAYLIST"]).read_text(encoding="utf-8-sig").splitlines()
          if extra_lines and extra_lines[0].startswith("#EXTM3U"):
              extra_lines = extra_lines[1:]

          sport_lines = Path(os.environ["SPORT_PLAYLIST"]).read_text(encoding="utf-8-sig").splitlines()
          if sport_lines and sport_lines[0].startswith("#EXTM3U"):
              sport_lines = sport_lines[1:]

          fresh_vtvcab = extract_vtvcab_entries(Path("vtvcab-source.m3u").read_text(encoding="utf-8-sig").splitlines())
          fallback_vtvcab = extract_vtvcab_entries(Path(os.environ["VTVCAP_FALLBACK"]).read_text(encoding="utf-8-sig").splitlines())
          vtvcab_entries = [fresh_vtvcab.get(name) or fallback_vtvcab.get(name) for name in TARGET_CHANNELS]
          vtvcab_entries = [entry for entry in vtvcab_entries if entry]

          if os.environ.get("GOLDEN_TV_SOURCE_READY") == "1":
              golden_entries = extract_golden_tv_entries(Path("golden-tv-source.m3u").read_text(encoding="utf-8-sig").splitlines())
              if golden_entries:
                  Path(os.environ["GOLDEN_TV_FALLBACK"]).write_text("#EXTM3U\n" + "\n\n".join(golden_entries) + "\n", encoding="utf-8")

          if os.environ.get("UK_FOOTBALL_SOURCE_READY") == "1":
              uk_football_entries = extract_uk_football_entries(Path("uk-football-source.m3u").read_text(encoding="utf-8-sig").splitlines())
              if uk_football_entries:
                  Path(os.environ["UK_FOOTBALL_FALLBACK"]).write_text("#EXTM3U\n" + "\n\n".join(uk_football_entries) + "\n", encoding="utf-8")

          uk_football_lines = []
          uk_football_path = Path(os.environ["UK_FOOTBALL_FALLBACK"])
          if uk_football_path.exists():
              uk_football_lines = uk_football_path.read_text(encoding="utf-8-sig").splitlines()
              if uk_football_lines and uk_football_lines[0].startswith("#EXTM3U"):
                  uk_football_lines = uk_football_lines[1:]

          merged_sections = ["\n".join(filtered_lines).rstrip(), "\n".join(extra_lines).strip(), "\n\n".join(vtvcab_entries), "\n".join(sport_lines).strip(), "\n".join(uk_football_lines).strip()]
          Path(os.environ["OUTPUT_PLAYLIST"]).write_text("\n\n".join(section for section in merged_sections if section) + "\n", encoding="utf-8")
          PY

      - name: Commit an update when needed
        run: |
          if [ -z "$(git status --porcelain -- IPTV_Gop_VMTTV_vAppTV.m3u sources/golden-tv-selected.m3u sources/uk-football-selected.m3u)" ]; then
            echo "Playlist is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add IPTV_Gop_VMTTV_vAppTV.m3u sources/golden-tv-selected.m3u sources/uk-football-selected.m3u
          git commit -m "Update IPTV playlists"

          # Another workflow may update main while this job is running.
          # Rebase and retry instead of failing with "fetch first".
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Could not rebase generated playlist commit onto latest main."
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race detected (attempt $attempt/5); retrying..."
            sleep $((attempt * 2))
          done

          echo "::error::Failed to push generated playlist after 5 attempts."
          exit 1

