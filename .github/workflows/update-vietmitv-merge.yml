name: Update filtered TV merged playlist

on:
  schedule:
    - cron: "0-59/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/build-vietmitv-merge.mjs"
      - ".github/workflows/update-vietmitv-merge.yml"

permissions:
  contents: write

concurrency:
  group: update-vietmitv-merge
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate filtered playlist
        run: |
          set -euo pipefail
          node --check tools/build-vietmitv-merge.mjs
          node tools/build-vietmitv-merge.mjs
          test -s generated/vietmitv-merge.m3u
          grep -Eq '^#EXTM3U' generated/vietmitv-merge.m3u
          grep -Eq '^#EXTINF:' generated/vietmitv-merge.m3u

      - name: Validate selected groups and DRM removal
        run: |
          python3 - <<'PY'
          import re
          import unicodedata
          from pathlib import Path

          path = Path("generated/vietmitv-merge.m3u")
          text = path.read_text(encoding="utf-8-sig")
          main_groups = {
              "htv", "htvc", "quoc te", "sctv", "su kien fpt",
              "su kien tv360", "the thao", "vtv", "vtvcab", "giai tri",
          }
          sports_groups = {
              "gio vang tv", "ga vang 24h tv", "ga vang 33 tv", "s8 tv", "sao ke tv",
          }

          def normalize(value):
              value = unicodedata.normalize("NFD", value).replace("đ", "d").replace("Đ", "D")
              value = "".join(ch for ch in value if unicodedata.category(ch) != "Mn")
              return re.sub(r"[^a-z0-9]", "", value.casefold())

          allowed = {normalize(x) for x in main_groups | sports_groups}
          expected_sports = {normalize(x) for x in sports_groups}
          entries, current = [], []
          for line in text.splitlines():
              if line.lstrip().upper().startswith("#EXTINF:"):
                  if current:
                      entries.append(current)
                  current = [line]
              elif current:
                  current.append(line)
          if current:
              entries.append(current)

          def group_of(entry):
              extinf = next((x for x in entry if x.lstrip().upper().startswith("#EXTINF:")), "")
              match = re.search(r"""\bgroup-title\s*=\s*["']([^"']*)["']""", extinf, re.I)
              if match:
                  return match.group(1).strip()
              extgrp = next((x for x in entry if x.lstrip().upper().startswith("#EXTGRP:")), "")
              return re.sub(r"^\s*#EXTGRP:", "", extgrp, flags=re.I).strip()

          def is_drm(entry):
              value = "\n".join(entry)
              patterns = [
                  r"inputstream\.adaptive\.license_(?:type|key|url|data)",
                  r"""(?:^|[^a-z])license[_-]?(?:type|key|url|server|data)\s*["']?\s*[:=]""",
                  r"(?:com\.widevine\.alpha|org\.w3\.clearkey|widevine|playready|clearkey|skd://)",
                  r"\bdrm\s*[:=]\s*(?:true|1|yes)\b",
                  r"#EXT-X-(?:KEY|SESSION-KEY):[^\r\n]*METHOD\s*=\s*SAMPLE-AES(?:-CTR)?",
              ]
              return any(re.search(pattern, value, re.I | re.M) for pattern in patterns)

          groups = set()
          for entry in entries:
              group = group_of(entry)
              key = normalize(group)
              if key not in allowed:
                  raise SystemExit(f"Unexpected or missing group-title: {group!r}")
              groups.add(key)
              if is_drm(entry):
                  raise SystemExit(f"DRM-marked entry remains in group {group!r}")
          missing = expected_sports - groups
          if missing:
              raise SystemExit("Missing sports groups: " + ", ".join(sorted(missing)))
          replacement_fpt = normalize("Sự kiện FPT")
          legacy_fpt = normalize("Sự Kiện FPT PLAY")
          if replacement_fpt not in groups:
              raise SystemExit("Missing replacement group: Sự kiện FPT")
          if legacy_fpt in groups:
              raise SystemExit("Legacy group must be fully removed: Sự Kiện FPT PLAY")
          if not entries:
              raise SystemExit("No valid channel entries generated")
          print(f"Validated {len(entries)} entries; {len(groups)} allowed groups; no DRM-marked entries.")
          PY

      - name: Commit only when playlist content changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f generated/vietmitv-merge.m3u
          if git diff --cached --quiet -- generated/vietmitv-merge.m3u; then
            echo "Playlist unchanged; no commit required."
            exit 0
          fi
          git commit -m "Update filtered TV playlist"
          git push origin HEAD:main
