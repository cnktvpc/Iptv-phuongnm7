name: Build TV365 playlist

on:
  push:
    branches: [main]
    paths:
      - tv365-source.gz.b64
      - .github/workflows/build-tv365.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tv365-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode M3U
        run: |
          base64 -d tv365-source.gz.b64 | gzip -d > tv365.m3u
          test -s tv365.m3u

      - name: Commit generated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tv365.m3u
          if git diff --cached --quiet; then
            echo "No playlist changes."
          else
            git commit -m "Build TV365 dynamic playlist"
            git push
          fi

      - name: Verify generated M3U
        run: |
          test -s tv365.m3u
          head -n 1 tv365.m3u | grep -q '^#EXTM3U'

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp tv365.m3u _site/tv365.m3u
          printf '%s\n' 'TV365 M3U playlist endpoint' > _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
