name = "nm7-fpt-event-watchdog"
main = "src/index.js"
compatibility_date = "2026-09-25"
workers_dev = true

# Public GitHub REST and status endpoints are read-only; no personal access token is required.

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
